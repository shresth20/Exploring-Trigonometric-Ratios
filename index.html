<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="uiTitle">Exploring Trigonometric Ratios</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/trig.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- The point every line end wears where the figure has no point of its
       own: one marker, referenced by the .pt-end / .pt-ends classes. -->
  <svg class="pt-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <marker id="ptMark" viewBox="-6 -6 12 12" refX="0" refY="0"
              markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse"
              overflow="visible">
        <circle class="pt-mark" r="5.5" />
      </marker>
    </defs>
  </svg>

  <!-- The swamp the whole lesson is set on, covering the window, back to
       front: its sky with the clouds taken out and the water smoothed to
       its glow (sky.webp); the clouds drifting over it, the water's ripples
       flowing across it and the far mist lying on it (js/scenery.js); a
       big tree at each bottom corner; and the near mist over their roots. -->
  <div class="scenery" aria-hidden="true">
    <div class="scenery__art">
      <img class="cloud cloud--1" src="assets/new/scenery/cloud-1.webp" alt="">
      <img class="cloud cloud--2" src="assets/new/scenery/cloud-2.webp" alt="">
      <img class="cloud cloud--3" src="assets/new/scenery/cloud-3.webp" alt="">
      <img class="cloud cloud--4" src="assets/new/scenery/cloud-4.webp" alt="">
      <div class="water water--far"></div>
      <div class="water water--near"></div>
      <img class="mist mist--far" src="assets/new/scenery/fog-a.webp" alt="">
    </div>
    <img class="tree tree--left" src="assets/new/scenery/tree-big-a.webp" alt="">
    <img class="tree tree--right" src="assets/new/scenery/tree-big-b.webp" alt="">
    <img class="mist mist--near" src="assets/new/scenery/fog-b.webp" alt="">
  </div>

  <main id="app">
    <!-- The 16:9 box the whole lesson is staged in. The board and the Next
         control are both positioned against THIS. -->
    <div class="frame" id="frame">

      <!-- The welcome's and the end's stage (js/tank.js): a stone causeway
           across the swamp, and the commander's tank driving onto it. She
           climbs out of its hatch to say the line in the bubble beside her.
           The tank is laid out in the hull's own pixels -- hull.webp is
           1000 x 322 at (0, 0) -- with its other parts placed against it,
           and nothing in it that moves carries a transform of its own. -->
      <div class="host" id="host" hidden aria-hidden="true">
        <div class="road" id="road"></div>
        <svg class="tank" id="tank" viewBox="0 -165 1060 490" focusable="false">
          <defs>
            <radialGradient id="tankShadow">
              <stop offset="0" stop-color="#021618" stop-opacity=".4" />
              <stop offset="1" stop-color="#021618" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="lidShutFace" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#a5b36f" />
              <stop offset="1" stop-color="#6f7d52" />
            </linearGradient>
            <linearGradient id="lidOpenFace" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#6f7d52" />
              <stop offset="1" stop-color="#4a5638" />
            </linearGradient>
            <!-- What of her shows: everything above the middle of the hole,
                 and the inside of the hole itself, so the ring's front lip
                 painted on the hull is what hides the rest of her. -->
            <clipPath id="hatchClip">
              <rect x="-400" y="-600" width="1860" height="633" />
              <ellipse cx="410" cy="33" rx="84" ry="7" />
            </clipPath>
            <!-- One mouth's cell of lips.webp, round the point of it that is
                 the middle of the mouth's two corners. -->
            <clipPath id="mouthCell">
              <rect x="-11.085" y="-5.81" width="22.253" height="18.68" />
            </clipPath>
          </defs>

          <ellipse class="tank__shadow" cx="430" cy="318" rx="440" ry="18" fill="url(#tankShadow)" />

          <!-- The hull and everything riding on it: it rumbles, dips and
               squats on its wheels, which stay on the road. -->
          <g id="tankBody">
            <image href="assets/new/tank/parts/barrel.webp" x="372.32" y="-46.46" width="681.4" height="146.34" />
            <image href="assets/new/tank/parts/dome.webp" x="341.2" y="-32.44" width="190" height="153.9" />
            <image href="assets/new/tank/parts/hull.webp" x="0" y="0" width="1000" height="322" />

            <!-- The lid thrown open: stood up on its hinge behind her,
                 its inside to us -- the seal round it and the latch. -->
            <rect class="lid__hinge" id="lidHinge" x="372.2" y="19" width="75.6" height="12" rx="5" />
            <g class="lid lid--open" id="lidOpen">
              <circle class="lid__face" cx="410" cy="-65" r="90" fill="url(#lidOpenFace)" />
              <circle class="lid__seal" cx="410" cy="-65" r="72" />
              <rect class="lid__latch" x="381.2" y="-48.8" width="57.6" height="12.6" rx="3" />
            </g>
            <!-- The lid shut, lying in the ring: its edge, its face, the
                 grab handle on top and three rivets along the front. -->
            <g class="lid lid--shut" id="lidShut">
              <ellipse class="lid__edge" cx="410" cy="38" rx="90" ry="8" />
              <ellipse class="lid__face" cx="410" cy="33" rx="90" ry="8" fill="url(#lidShutFace)" />
              <path class="lid__grip" d="M393.8 29.8 L399.2 16 L420.8 16 L426.2 29.8" />
              <path class="lid__grip-hi" d="M393.8 29.8 L399.2 16 L420.8 16 L426.2 29.8" />
              <circle class="lid__rivet" cx="356" cy="35.8" r="3.5" />
              <circle class="lid__rivet" cx="410" cy="37.4" r="3.5" />
              <circle class="lid__rivet" cx="464" cy="35.8" r="3.5" />
            </g>

            <g class="tank__steam" id="tankSteam"></g>
            <g class="tank__pop" id="tankPop"></g>

            <!-- The commander (commander.webp), and her eyes shut
                 (commander_face.webp) laid over it to blink. While she
                 talks, her painted smile is covered with her own skin
                 (mouth-patch.webp) and the mouth she is making is shown
                 over it: the strip of mouths A..P (lips.webp) slid under
                 a window one mouth wide, set at her mouth and tilted to
                 her three-quarter face. -->
            <g clip-path="url(#hatchClip)">
              <g id="tankCmdr">
                <image href="assets/new/tank/commander.webp" x="320.18" y="-105.17" width="176.39" height="197.69" />
                <image class="tank__blink" id="tankBlink" href="assets/new/tank/commander_face.webp" x="394.25" y="-32.48" width="65.74" height="35.65" />
                <g class="tank__mouth" id="tankMouth">
                  <image href="assets/new/tank/parts/mouth-patch.webp" x="408.14" y="-0.54" width="32.41" height="20.37" />
                  <g transform="translate(424.35 8.72) rotate(10)">
                    <g clip-path="url(#mouthCell)">
                      <image id="tankLips" href="assets/new/tank/parts/lips.webp" x="-11.085" y="-5.81" width="356.05" height="18.68" />
                    </g>
                  </g>
                </g>
              </g>
            </g>
          </g>

          <!-- The road wheels over the track, each turning about its hub. -->
          <image class="tank__wheel" href="assets/new/tank/parts/wheel.webp" x="147.46" y="206.66" width="109.88" height="109.88" />
          <image class="tank__wheel" href="assets/new/tank/parts/wheel.webp" x="292.26" y="206.66" width="109.88" height="109.88" />
          <image class="tank__wheel" href="assets/new/tank/parts/wheel.webp" x="439.66" y="206.66" width="109.88" height="109.88" />
          <image class="tank__wheel" href="assets/new/tank/parts/wheel.webp" x="587.26" y="206.66" width="109.88" height="109.88" />
        </svg>
      </div>

      <!-- The welcome's first line and the end's last, in a speech bubble
           beside the commander, its tail pointing at her. It comes and goes
           with her. The tail is drawn over the bubble's edge: its fill
           covers the border where the two meet, and its outline is only
           the two slanted strokes. -->
      <div class="bubble" id="bubble" hidden>
        <span class="type-wrap" id="bubbleType">
          <span class="type-ghost"></span>
          <span class="type" aria-live="polite"><span class="txt"></span></span>
        </span>
        <svg class="bubble__tail" viewBox="0 0 40 34" aria-hidden="true" focusable="false">
          <path class="bubble__tail-fill" d="M41 3 L2 29 L41 19 Z" />
          <path class="bubble__tail-line" d="M40 3 L2 29 L40 19" />
        </svg>
      </div>

      <section class="board" id="board" aria-hidden="true">
        <header class="board__top" id="boardTop">
          <div class="prompt" id="prompt">
            <p class="prompt__line">
              <span class="type-wrap" id="promptType">
                <span class="type-ghost"></span>
                <span class="type" aria-live="polite"><span class="txt"></span></span>
              </span>
            </p>
          </div>
        </header>

        <div class="board__stage" id="boardStage">
          <!-- The whole lesson's picture, in ONE svg. Wide rather than
               square -- 1000 x 420 -- so a triangle standing in the left
               half leaves the right half to the working. Each section
               builds its own triangle into a group of its own. The view
               starts at y = 45, not 0: the sections draw low in the 420
               (their drawings' middle is near y = 255), so this puts the
               drawing in the middle of the stage, not under it. -->
          <svg class="figure" id="figure" viewBox="0 45 1000 420"
               role="img" data-i18n-attr="aria-label:a11yFigure" aria-label="A right-angled triangle">
            <defs>
              <!-- The bloom under a mark while it is being named: a
                   blurred copy of the mark itself, so the glow is always in
                   the mark's OWN ink. -->
              <filter id="partGlow" filterUnits="userSpaceOnUse"
                      x="-200" y="-200" width="1400" height="820">
                <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="bloom" />
                <feMerge>
                  <feMergeNode in="bloom" />
                  <feMergeNode in="bloom" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <!-- The neon every line of the triangle is drawn in: a softer,
                   always-on bloom of the line's own ink under it. -->
              <filter id="neon" filterUnits="userSpaceOnUse"
                      x="-200" y="-200" width="1400" height="820">
                <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="bloom" />
                <feMerge>
                  <feMergeNode in="bloom" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <!-- The light on a word while it is spoken of (.is-glowing-text):
                   a soft gold halo round the word's own shape. -->
              <filter id="hiGlow" filterUnits="userSpaceOnUse"
                      x="-200" y="-200" width="1400" height="820">
                <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="fat" />
                <feGaussianBlur in="fat" stdDeviation="5" result="soft" />
                <feFlood class="hi-glow__ink" result="ink" />
                <feComposite in="ink" in2="soft" operator="in" result="halo" />
                <feMerge>
                  <feMergeNode in="halo" />
                  <feMergeNode in="halo" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <!-- Section 1: the right-angled triangle and its sides -->
            <g id="figS1" hidden></g>
            <g id="figS1b" hidden></g>
            <!-- Section 2: the ratios and the 45° triangle -->
            <g id="figS2" hidden></g>
            <!-- Section 3: the equilateral triangle and its halves -->
            <g id="figS3" hidden></g>
            <g id="figS3L" hidden></g>
            <g id="figS3R" hidden></g>
            <!-- Section 4: the 60° angle, on the same half -->
            <g id="figS4" hidden></g>
            <!-- Section 5: the triangles of "your turn", and towards 0° -->
            <g id="figS5F" hidden></g>
            <g id="figS5" hidden></g>
            <!-- Section 6: towards 90° -->
            <g id="figS6" hidden></g>

            <!-- Where the activity hangs its boxes and leaders -->
            <g id="figBoxes" hidden></g>
            <!-- Where a burst of confetti is thrown over the figure -->
            <g id="figBurst" aria-hidden="true"></g>
            <g id="figNudges" aria-hidden="true"></g>
          </svg>

          <!-- The right half of the stage, for the working: the equations,
               the dropdown blanks, the pills and the slider (js/widgets.js),
               in the box laid under them. -->
          <div class="pane" id="pane" hidden data-i18n-attr="aria-label:a11yPane" aria-label="The working">
            <div class="pane__box" id="paneBox" aria-hidden="true"></div>
            <div class="pane__body" id="paneBody"></div>
          </div>

          <!-- The table of values, centred over the stage when it is shown. -->
          <div class="table-wrap" id="tableWrap" hidden></div>
        </div>

        <!-- The footer holds whatever the learner has to reach for: the names
             they drag onto the boxes, or the one control a page asks to be
             pressed. Never both at once, so they share the band. -->
        <footer class="board__bottom" id="boardBottom">
          <div class="tray" id="tray" hidden data-i18n-attr="aria-label:a11yNamesTray" aria-label="Names to drag"></div>
          <div class="tray tray--choice" id="choices" hidden
               role="group" data-i18n-attr="aria-label:a11yAnswers" aria-label="Choose your answer"></div>
        </footer>
      </section>

      <!-- Not drawn, not focusable, and not a control: one element for a
           beat finished by SEVERAL actions to announce itself on. -->
      <span id="gate" hidden></span>

      <!-- Where a burst of confetti is thrown, over everything in the frame. -->
      <svg class="burst-layer" id="burst" aria-hidden="true"></svg>

      <!-- Next: the painted gold key, a white arrow on a glossy gold coin
           -- the art itself the whole button, as Start's is. Named by its
           aria-label alone. -->
      <button class="next-btn" id="nextBtn" type="button" hidden data-i18n-attr="aria-label:a11yNext" aria-label="Next">
        <img class="next-btn__art" src="assets/images/next-btn.webp" alt="" draggable="false">
      </button>

      <!-- Restart, at the end, in Next's corner: an orange key, as the
           game's keys are drawn, with an arrow coming round on itself,
           outlined in the same dark as Next's. -->
      <button class="restart-btn" id="restartBtn" type="button" hidden>
        <svg class="restart-btn__icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <path d="M63 27.5 A26 26 0 1 1 37 27.5" fill="none"
                stroke="var(--text-outline)" stroke-width="20" stroke-linecap="round" />
          <path d="M51 19.5 L41.8 39.8 L28.8 17.2 Z" fill="var(--text-outline)"
                stroke="var(--text-outline)" stroke-width="16" stroke-linejoin="round" />
          <path d="M63 27.5 A26 26 0 1 1 37 27.5" fill="none"
                stroke="var(--white)" stroke-width="10" stroke-linecap="round" />
          <path d="M51 19.5 L41.8 39.8 L28.8 17.2 Z" fill="var(--white)"
                stroke="var(--white)" stroke-width="7" stroke-linejoin="round" />
        </svg>
        <span data-i18n="btnRestart">Restart</span>
      </button>
    </div>

    <!-- Welcome, over everything until Start is pressed: its own painting
         (welcome.webp, the title lettered into it) and Start over its water.
         The title is kept as a heading too, for screen readers. -->
    <section class="welcome" id="welcome">
      <img class="welcome__art" src="assets/images/welcome.webp" alt="" aria-hidden="true">
      <h1 class="welcome__title" data-i18n="uiTitle">Exploring Trigonometric Ratios</h1>
      <div class="loader" id="loader" role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="0" data-i18n-attr="aria-label:loadingAria">
        <span class="loader__body">
          <span class="loader__text"><span data-i18n="loadingLabel"></span><span class="loader__pct" id="loaderPct"></span></span>
          <span class="loader__line"><span class="loader__fill" id="loaderFill"></span></span>
        </span>
      </div>
      <!-- Start: the play key painted for the swamp (play-btn.webp), a
           slime-hung stone ring round a gold play mark. Named by its
           aria-label alone. -->
      <button class="start-btn" id="startBtn" type="button" hidden data-i18n-attr="aria-label:btnStart" aria-label="Start">
        <img class="start-btn__art" src="assets/images/play-btn.webp" alt="" draggable="false">
      </button>
    </section>
  </main>

  <script src="js/libs/gsap.min.js"></script>
  <script src="js/libs/Flip.min.js"></script>
  <!-- Words by key (js/i18n.js, T('key')) from locales/locales.json; the
       .js copy is read in first so file:// works too. -->
  <script src="locales/locales.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/flow.js"></script>
  <script src="js/mathtext.js"></script>
  <script src="js/typer.js"></script>
  <script src="js/tank.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/tri.js"></script>
  <script src="js/widgets.js"></script>
  <!-- The eight sections of the lesson, in playing order. Each joins the
       lesson in load order (Pages.addSection). -->
  <script src="js/s1-sides.js"></script>
  <script src="js/s2-ratios.js"></script>
  <script src="js/s3-thirty.js"></script>
  <script src="js/s4-sixty.js"></script>
  <script src="js/s5-zero.js"></script>
  <script src="js/s6-ninety.js"></script>
  <script src="js/s7-table.js"></script>
  <script src="js/s8-more.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/script.js"></script>
  <!-- TEMPORARY: the Back / Skip / Replay page bar. Delete this line and
       js/devnav.js to remove it; nothing else refers to it. -->
  <script src="js/devnav.js"></script>
</body>
</html>
